<!-- @dsCard group="Web App" viewport="1320x860" name="AbleSpace Web App" subtitle="Caseload dashboard, IEP goal tracking & one-tap data collection." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AbleSpace — Web App</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="CaseloadScreen.jsx"></script>
<script type="text/babel" src="StudentScreen.jsx"></script>
<script type="text/babel" src="CollectDrawer.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const DS = window.AbleSpaceDesignSystem_737c4f;
  const Icon = DS.Icon;

  const TITLES = {
    dashboard: ["Lincoln Elementary", "Dashboard"],
    caseload: ["Special Education", "Caseload"],
    schedule: ["This week", "Schedule"],
    data: ["All goals", "Data Collection"],
    reports: ["IEP meetings", "Reports"],
    assessments: ["Progress monitoring", "Assessments"],
    billing: ["March", "Medicaid Billing"],
    ai: ["Beta", "AI Assistant"],
  };

  function App() {
    const [route, setRoute] = React.useState("dashboard");
    const [studentId, setStudentId] = React.useState(null);
    const [drawer, setDrawer] = React.useState({ open: false, goal: null });
    const [toast, setToast] = React.useState(false);

    const openStudent = (id) => { setStudentId(id); setRoute("student"); };
    const collect = (goal) => setDrawer({ open: true, goal: goal || null });
    const closeDrawer = () => setDrawer((d) => ({ ...d, open: false }));
    const saved = () => { closeDrawer(); setToast(true); setTimeout(() => setToast(false), 2600); };

    let title, crumbs, body;
    if (route === "student") {
      crumbs = "Caseload"; title = "Student";
      body = <StudentScreen studentId={studentId} onBack={() => setRoute("caseload")} onCollect={collect} />;
    } else {
      [crumbs, title] = TITLES[route] || ["", ""];
      if (route === "dashboard") body = <DashboardScreen onOpenStudent={openStudent} />;
      else if (route === "caseload") body = <CaseloadScreen onOpenStudent={openStudent} />;
      else body = <Placeholder route={route} />;
    }

    return (
      <div className="app">
        <Sidebar active={route === "student" ? "caseload" : route} onNav={(r) => { setRoute(r); }} />
        <div className="main">
          <TopBar title={title} crumbs={crumbs} onCollect={() => collect(null)} />
          <div className="content">{body}</div>
        </div>
        <CollectDrawer open={drawer.open} goal={drawer.goal} onClose={closeDrawer} onSaved={saved} />
        <div className={"toast" + (toast ? " toast--show" : "")}>
          <Icon name="check-circle-2" size={18} /> Data point saved · graph updated
        </div>
      </div>
    );
  }

  function Placeholder({ route }) {
    const { Eyebrow } = DS;
    return (
      <div className="content__inner" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",padding:"80px 0",color:"var(--text-muted)"}}>
        <span style={{display:"inline-flex",width:56,height:56,borderRadius:16,background:"var(--accent-soft)",color:"var(--evergreen-700)",alignItems:"center",justifyContent:"center",marginBottom:18}}>
          <Icon name="hammer" size={26} />
        </span>
        <div style={{fontFamily:"var(--font-display)",fontSize:24,color:"var(--text-strong)",marginBottom:6,textTransform:"capitalize"}}>{route}</div>
        <p style={{maxWidth:"34ch"}}>This surface isn't part of the kit demo. Explore Dashboard and Caseload for the full interactive flow.</p>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
