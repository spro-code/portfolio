<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-card); padding: 26px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; max-width: 620px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin: 6px 0 12px; grid-column: 1 / -1; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.AbleSpaceDesignSystem_737c4f;
  function Demo() {
    return (
      <div className="grid">
        <Field label="Search caseload">
          <Input icon="search" placeholder="Search students…" />
        </Field>
        <Field label="Subject area">
          <Select options={[{value:"r",label:"Reading"},{value:"m",label:"Math"},{value:"b",label:"Behavior"}]} />
        </Field>
        <Field label="Progress note" hint="Auto-saved as you type" style={{gridColumn:"1 / -1"}}>
          <Textarea placeholder="Maya completed 8 of 10 trials independently…" />
        </Field>
        <Field label="Email" error="Enter a valid school email">
          <Input defaultValue="maya@" invalid />
        </Field>
        <Field label="Data type">
          <div style={{display:"flex",flexDirection:"column",gap:"10px",marginTop:"4px"}}>
            <Radio name="dt" label="Frequency" defaultChecked />
            <Radio name="dt" label="Duration" />
          </div>
        </Field>
        <div className="glabel">Checkbox &amp; switch</div>
        <div className="row">
          <Checkbox label="Met goal today" defaultChecked />
          <Checkbox label="Needs follow-up" />
          <Switch label="Notify team" defaultChecked />
          <Switch label="Medicaid billable" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
