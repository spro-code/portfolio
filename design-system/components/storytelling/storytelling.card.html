<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); padding: 30px; font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 28px; max-width: 640px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { SectionHeader, StoryModule, MetricStat, Journey, PullQuote } = window.AbleSpaceDesignSystem_737c4f;
  function Demo() {
    return (
      <div className="stack">
        <SectionHeader
          eyebrow="03 — Insight"
          title="Teachers don't need more data. They need to <em>see what it means.</em>"
          lead="The opportunity wasn't another dashboard — it was a clearer line of sight from observation to decision."
        />
        <div className="two">
          <StoryModule kind="challenge" title="Data lived everywhere — and nowhere."
            body="Sticky notes, binders, and six disconnected tools meant hours of reconciliation each week." />
          <StoryModule kind="solution" title="One tap to collect. One place to see it all."
            points={["10+ data types", "Auto-generated IEP graphs", "Secure team collaboration"]} />
        </div>
        <StoryModule kind="metrics" title="What changed">
          <div className="metrics-grid" style={{marginTop:"8px"}}>
            <MetricStat value="87" unit="%" label="of goals on track" delta="12 pts" deltaDir="up" />
            <MetricStat value="12.5" unit="h" label="saved per week" delta="3.1 h" deltaDir="up" />
            <MetricStat value="6→1" label="tools consolidated" />
          </div>
        </StoryModule>
        <Journey steps={[
          {title:"Problem discovery", desc:"Shadowed 40 SPED teachers across 9 districts", icon:"search", state:"done"},
          {title:"User research", desc:"120 interviews with teachers, SLPs & admins", icon:"users-round", state:"done"},
          {title:"Execution", desc:"Shipping one-tap data collection", icon:"rocket", state:"active"},
          {title:"Impact", desc:"Measuring time returned to students", icon:"trending-up", state:"upcoming"},
        ]} />
        <PullQuote name="Jordan Ellis" role="SLP · Lincoln Elementary">
          15 years and 6 data systems later, finally I have found the perfect solution for data collection.
        </PullQuote>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
