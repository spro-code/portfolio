<!-- @dsCard group="Components" viewport="700x420" name="Surfaces — cards, tabs, progress" subtitle="Cards, segmented & underline tabs, progress bars, tooltips." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); padding: 26px; font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
  .glabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin: 4px 0 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, Tabs, ProgressBar, Tooltip, IconButton, Badge } = window.AbleSpaceDesignSystem_737c4f;
  function Demo() {
    const [tab, setTab] = React.useState("goals");
    return (
      <>
        <div className="row">
          <Card style={{width:"240px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <span className="as-title-3" style={{fontSize:"17px"}}>Reading fluency</span>
              <Badge tone="success" dot>On track</Badge>
            </div>
            <p className="as-body" style={{fontSize:"14px",margin:"0 0 14px"}}>87% of trials met this week.</p>
            <ProgressBar value={87} tone="spring" />
          </Card>
          <Card interactive style={{width:"240px"}}>
            <div className="glabel" style={{margin:"0 0 8px"}}>Interactive · hover me</div>
            <span className="as-title-3" style={{fontSize:"17px"}}>Behavior log</span>
            <p className="as-body" style={{fontSize:"14px",margin:"6px 0 0"}}>Lifts on hover for clickable cards.</p>
          </Card>
          <Card variant="sunk" style={{width:"150px"}}>
            <div className="glabel" style={{margin:0}}>Sunk</div>
          </Card>
        </div>
        <div className="row" style={{gap:"32px",alignItems:"center"}}>
          <div>
            <div className="glabel">Segmented</div>
            <Tabs items={[{value:"goals",label:"Goals",icon:"target"},{value:"data",label:"Data",icon:"bar-chart-3"},{value:"notes",label:"Notes"}]} value={tab} onChange={setTab} />
          </div>
          <div>
            <div className="glabel">Tooltip</div>
            <Tooltip label="Collect data on this goal">
              <IconButton icon="plus" variant="secondary" label="Add" />
            </Tooltip>
          </div>
        </div>
        <div>
          <div className="glabel">Underline tabs</div>
          <Tabs variant="underline" items={[{value:"goals",label:"Overview"},{value:"data",label:"Caseload"},{value:"notes",label:"Reports"}]} value={tab} onChange={setTab} />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
