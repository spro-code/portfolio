<!-- @dsCard group="Colors" viewport="700x170" name="Status & data-viz" subtitle="Success, warning, danger, info — plus the categorical graph palette." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px; }
  .sec { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; }
  .row { display: flex; gap: 10px; }
  .pill { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .data { display: flex; gap: 0; margin-top: 16px; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .data > div { flex: 1; height: 40px; }
  .dlab { display:flex; gap:0; margin-top:6px; }
  .dlab > span { flex:1; text-align:center; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="sec">Status</div>
  <div class="row">
    <div class="pill" style="background:var(--success-soft);color:var(--success)"><span class="dot" style="background:var(--success)"></span>Success</div>
    <div class="pill" style="background:var(--warning-soft);color:var(--warning)"><span class="dot" style="background:var(--warning)"></span>Warning</div>
    <div class="pill" style="background:var(--danger-soft);color:var(--danger)"><span class="dot" style="background:var(--danger)"></span>Danger</div>
    <div class="pill" style="background:var(--info-soft);color:var(--info)"><span class="dot" style="background:var(--info)"></span>Info</div>
  </div>
  <div class="sec" style="margin-top:18px">Data-viz categorical</div>
  <div class="data">
    <div style="background:var(--data-1)"></div>
    <div style="background:var(--data-2)"></div>
    <div style="background:var(--data-3)"></div>
    <div style="background:var(--data-4)"></div>
    <div style="background:var(--data-5)"></div>
    <div style="background:var(--data-6)"></div>
  </div>
  <div class="dlab"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
</body>
</html>
