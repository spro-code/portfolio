<!-- @dsCard group="Type" viewport="700x300" name="Type pairing in use" subtitle="Serif + grotesque + mono working together in a story block." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 30px 34px; font-family: var(--font-sans); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 16px; }
  h2 { font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.06; letter-spacing: -0.02em; color: var(--text-strong); margin-bottom: 16px; max-width: 18ch; }
  h2 em { font-style: italic; font-weight: 400; color: var(--evergreen-700); }
  p { font-size: 16px; line-height: 1.62; color: var(--text-muted); max-width: 52ch; }
</style>
</head>
<body>
  <div class="eyebrow">03 — Insight</div>
  <h2>Teachers don't need more data. They need to <em>see what it means.</em></h2>
  <p>Every minute spent wrestling a spreadsheet is a minute not spent with a student. The opportunity wasn't another dashboard — it was a clearer line of sight from observation to decision.</p>
</body>
</html>
