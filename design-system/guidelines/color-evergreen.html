<!-- @dsCard group="Colors" viewport="700x200" name="Evergreen — primary brand" subtitle="Deep, confident growth. The signature AbleSpace hue." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 2px; }
  .sw .n { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10px; opacity: 0.8; }
  .lt { color: var(--evergreen-900); }
  .dk { color: rgba(255,255,255,0.92); }
  .cap { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px; }
  .cap .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .cap .meta { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="cap"><span class="lbl">Evergreen</span><span class="meta">Primary · accent · brand surfaces</span></div>
  <div class="row">
    <div class="sw lt" style="background:var(--evergreen-50)"><span class="n">50</span><span class="h">#EAF3EE</span></div>
    <div class="sw lt" style="background:var(--evergreen-100)"><span class="n">100</span><span class="h">#CDE5D8</span></div>
    <div class="sw lt" style="background:var(--evergreen-200)"><span class="n">200</span><span class="h">#9FCBB2</span></div>
    <div class="sw lt" style="background:var(--evergreen-300)"><span class="n">300</span><span class="h">#6BAC8A</span></div>
    <div class="sw dk" style="background:var(--evergreen-400)"><span class="n">400</span><span class="h">#3E8A64</span></div>
    <div class="sw dk" style="background:var(--evergreen-500)"><span class="n">500</span><span class="h">#237A5C</span></div>
    <div class="sw dk" style="background:var(--evergreen-600)"><span class="n">600</span><span class="h">#1B5C45</span></div>
    <div class="sw dk" style="background:var(--evergreen-700)"><span class="n">700★</span><span class="h">#154836</span></div>
    <div class="sw dk" style="background:var(--evergreen-800)"><span class="n">800</span><span class="h">#103729</span></div>
    <div class="sw dk" style="background:var(--evergreen-900)"><span class="n">900</span><span class="h">#0C2B20</span></div>
  </div>
</body>
</html>
