<!-- @dsCard group="Colors" viewport="700x230" name="Spring + Clay — accents" subtitle="Spring green for live/interactive moments; clay for human warmth." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px; }
  .grp { margin-bottom: 16px; }
  .grp:last-child { margin-bottom: 0; }
  .cap { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 10px; }
  .cap .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .cap .meta { font-size: 12px; color: var(--text-muted); }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 64px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; gap: 2px; }
  .sw .n { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .lt { color: var(--evergreen-900); }
  .dk { color: rgba(255,255,255,0.95); }
</style>
</head>
<body>
  <div class="grp">
    <div class="cap"><span class="lbl">Spring</span><span class="meta">Live · active · focus · success</span></div>
    <div class="row">
      <div class="sw lt" style="background:var(--spring-300)"><span class="n">300</span><span class="h">#6FE3AE</span></div>
      <div class="sw lt" style="background:var(--spring-400)"><span class="n">400</span><span class="h">#3FCF92</span></div>
      <div class="sw dk" style="background:var(--spring-500)"><span class="n">500★</span><span class="h">#21B97B</span></div>
      <div class="sw dk" style="background:var(--spring-600)"><span class="n">600</span><span class="h">#169A66</span></div>
    </div>
  </div>
  <div class="grp">
    <div class="cap"><span class="lbl">Clay</span><span class="meta">Human warmth · highlights · secondary</span></div>
    <div class="row">
      <div class="sw lt" style="background:var(--clay-100)"><span class="n">100</span><span class="h">#F6E3D6</span></div>
      <div class="sw lt" style="background:var(--clay-200)"><span class="n">200</span><span class="h">#EBC3A8</span></div>
      <div class="sw lt" style="background:var(--clay-300)"><span class="n">300</span><span class="h">#DC9E78</span></div>
      <div class="sw dk" style="background:var(--clay-400)"><span class="n">400★</span><span class="h">#CC7C4F</span></div>
      <div class="sw dk" style="background:var(--clay-500)"><span class="n">500</span><span class="h">#B86038</span></div>
      <div class="sw dk" style="background:var(--clay-600)"><span class="n">600</span><span class="h">#984B2B</span></div>
    </div>
  </div>
</body>
</html>
