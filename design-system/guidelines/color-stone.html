<!-- @dsCard group="Colors" viewport="700x200" name="Stone — warm neutrals" subtitle="Paper-to-ink ramp. The warm canvas everything sits on." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px; }
  .cap { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px; }
  .cap .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .cap .meta { font-size: 12px; color: var(--text-muted); }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-faint); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 9px; gap: 2px; }
  .sw .n { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: 0.8; }
  .lt { color: var(--stone-900); }
  .dk { color: rgba(251,248,242,0.95); }
</style>
</head>
<body>
  <div class="cap"><span class="lbl">Stone</span><span class="meta">Surfaces · text · borders</span></div>
  <div class="row">
    <div class="sw lt" style="background:var(--stone-50)"><span class="n">50</span><span class="h">FBF8F2</span></div>
    <div class="sw lt" style="background:var(--stone-100)"><span class="n">100</span><span class="h">F4EFE5</span></div>
    <div class="sw lt" style="background:var(--stone-200)"><span class="n">200</span><span class="h">E0D8C7</span></div>
    <div class="sw lt" style="background:var(--stone-300)"><span class="n">300</span><span class="h">CCC2AD</span></div>
    <div class="sw lt" style="background:var(--stone-400)"><span class="n">400</span><span class="h">A89E86</span></div>
    <div class="sw dk" style="background:var(--stone-500)"><span class="n">500</span><span class="h">847B66</span></div>
    <div class="sw dk" style="background:var(--stone-600)"><span class="n">600</span><span class="h">61594A</span></div>
    <div class="sw dk" style="background:var(--stone-700)"><span class="n">700</span><span class="h">443E33</span></div>
    <div class="sw dk" style="background:var(--stone-800)"><span class="n">800</span><span class="h">2A2620</span></div>
    <div class="sw dk" style="background:var(--stone-900)"><span class="n">900★</span><span class="h">181611</span></div>
  </div>
</body>
</html>
