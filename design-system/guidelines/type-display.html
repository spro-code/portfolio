<!-- @dsCard group="Type" viewport="700x320" name="Display serif — Newsreader" subtitle="Editorial voice for narrative headlines. Set tight, often italic for emphasis." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 26px 28px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border-faint); }
  .spec:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); white-space: nowrap; width: 120px; flex: none; line-height: 1.5; }
  .sample { font-family: var(--font-display); color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.04; overflow: hidden; }
</style>
</head>
<body>
  <div class="spec">
    <div class="meta">Hero · 500<br>52–104px</div>
    <div class="sample" style="font-size:54px;font-weight:500">Every data point<br>tells a story.</div>
  </div>
  <div class="spec">
    <div class="meta">Display · 500<br>40–68px</div>
    <div class="sample" style="font-size:42px;font-weight:500">From observation to <em style="font-style:italic;font-weight:400">insight</em></div>
  </div>
  <div class="spec">
    <div class="meta">Title 1 · 500<br>32–48px</div>
    <div class="sample" style="font-size:32px;font-weight:500">Progress, made visible</div>
  </div>
</body>
</html>
